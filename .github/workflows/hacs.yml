name: HACS

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate HACS integration repository
        uses: hacs/action@main
        with:
          category: integration
