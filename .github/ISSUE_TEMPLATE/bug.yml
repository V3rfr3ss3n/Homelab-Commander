name: Bug report
description: Report reproducible integration behavior using sanitized data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, real hostnames, addresses, domains, or unredacted diagnostics.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
    validations:
      required: true
