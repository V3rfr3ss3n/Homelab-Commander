# Reuse the local gate; public distribution remains in the existing GitHub flows.
image: python:3.14.7-slim-bookworm@sha256:416f0db2a2b561945630cef9877a7ea0581b27449eb9fd9df42f03e1b74b5b63

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages: [validate]

variables:
  UV_CACHE_DIR: .cache/uv
  UV_LINK_MODE: copy
  UV_PYTHON: "3.14"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

quality:
  stage: validate
  timeout: 30m
  interruptible: true
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv]
  before_script:
    # Only disposable containers may install OS packages. Shell runners must
    # already provide Python, make, git, OpenSSH and Chromium libraries.
    - |
      if [ "${CI_DISPOSABLE_ENVIRONMENT:-false}" = "true" ] && [ "$(id -u)" = "0" ]; then
        apt-get update
        apt-get install --no-install-recommends -y make git openssh-client
      fi
    - |
      for tool in python3 make git ssh-keygen; do
        command -v "$tool" >/dev/null || { echo "Required runner tool missing: $tool"; exit 1; }
      done
    - |
      python3 - <<'PYTHON'
      import hashlib
      import io
      from pathlib import Path
      import platform
      import tarfile
      from urllib.request import urlopen

      hashes = {
          "x86_64": "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645",
          "aarch64": "229e194255c7958d86d56e8790d969a6f74736592133f0dfd0076f754c642c1d",
      }
      arch = platform.machine()
      if arch not in hashes:
          raise SystemExit("Unsupported CI architecture")
      name = f"uv-{arch}-unknown-linux-gnu"
      url = f"https://github.com/astral-sh/uv/releases/download/0.13.6/{name}.tar.gz"
      with urlopen(url, timeout=60) as response:
          data = response.read()
      if hashlib.sha256(data).hexdigest() != hashes[arch]:
          raise SystemExit("uv archive checksum mismatch")
      destination = Path(".cache/ci-tools")
      destination.mkdir(parents=True, exist_ok=True)
      with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
          archive.extractall(destination, filter="data")
      print("Verified uv 0.13.6 archive")
      PYTHON
    - export PATH="$CI_PROJECT_DIR/.cache/ci-tools/uv-$(uname -m)-unknown-linux-gnu:$PATH"
    - uv sync --locked
    - |
      if [ "${CI_DISPOSABLE_ENVIRONMENT:-false}" = "true" ] && [ "$(id -u)" = "0" ]; then
        uv run playwright install --with-deps chromium
      else
        uv run playwright install chromium
      fi
  script:
    - make quality
