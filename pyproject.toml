[project]
name = "home-assistant-homelab-updates"
version = "0.1.0"
description = "A Home Assistant custom integration for homelab update operations"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Homelab Updates contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.8.2",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component>=0.13.338",
  "ruff==0.12.12",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/homelab_updates"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "LOG",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "SLOT",
  "T20",
  "UP",
  "W",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.homelab_updates"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["custom_components/homelab_updates"]

[tool.uv]
default-groups = ["dev"]
