[project]
name = "home-assistant-homelab-updates"
version = "0.2.0.dev0"
description = "A Home Assistant custom integration for homelab update operations"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Homelab Updates contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "ansible-core==2.21.2",
  "fastapi==0.141.1",
  "uvicorn==0.51.0",
]

[project.scripts]
homelab-updates-backend = "homelab_backend.__main__:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/homelab_backend"]

[dependency-groups]
dev = [
  "home-assistant-frontend==20260729.7",
  "homeassistant==2026.8.2",
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "playwright==1.62.0",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component>=0.13.338",
  "ruff==0.16.3",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]

[tool.coverage.run]
branch = true
source = ["backend/homelab_backend", "custom_components/homelab_updates"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
preview = true
target-version = "py314"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "LOG",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "SLOT",
  "T20",
  "UP",
  "W",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.homelab_updates"]

[tool.ruff.lint.per-file-ignores]
# FastAPI/HA hooks stay async; awaited comprehensions require lists; UI assets
# intentionally preserve readable JavaScript/CSS lines inside Python strings.
"backend/homelab_backend/app.py" = ["C409", "E501", "RUF029"]
"backend/homelab_backend/ui.py" = ["E501"]
"backend/tests/test_automation.py" = ["RUF029"]
"custom_components/homelab_updates/__init__.py" = ["RUF029"]
"custom_components/homelab_updates/adapters/native.py" = ["C409"]
"custom_components/homelab_updates/binary_sensor.py" = ["RUF029"]
"custom_components/homelab_updates/button.py" = ["RUF029"]
"custom_components/homelab_updates/diagnostics.py" = ["RUF029"]
"custom_components/homelab_updates/repairs.py" = ["RUF029"]
"custom_components/homelab_updates/sensor.py" = ["RUF029"]
"custom_components/homelab_updates/update.py" = ["RUF029"]
"scripts/*.py" = ["T201"]
"tests/conftest.py" = ["RUF029"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["backend/homelab_backend", "custom_components/homelab_updates"]

[tool.uv]
default-groups = ["dev"]
