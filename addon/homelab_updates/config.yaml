name: Homelab Updates
version: 0.2.0-dev.0
slug: homelab_updates
description: Native host update backend and management UI for Homelab Updates
arch:
  - aarch64
  - amd64
image: ghcr.io/v3rfr3ss3n/homelab-updates-backend
init: false
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:server-network
panel_title: Homelab Updates Backend
panel_admin: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Native REST API (optional; protected by API token)
options:
  api_token: ""
  log_level: INFO
  allow_shell_tasks: false
schema:
  api_token: password
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
  allow_shell_tasks: bool
backup: hot
tmpfs: true
